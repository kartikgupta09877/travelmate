version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: travelmate-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: travelmate
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - travelmate-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travelmate-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      USE_MOCK_DB: "false"
      MONGODB_URI: "mongodb://mongodb:27017"
      MONGODB_DB: "travelmate"
      SEED_ON_STARTUP: "true"
      JWT_SECRET: "travelmate-production-secret-key-change-this-in-production-12345"
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "10080"
      CORS_ORIGINS: "http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - travelmate-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ""
    container_name: travelmate-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - travelmate-network

volumes:
  mongo_data:
    driver: local

networks:
  travelmate-network:
    driver: bridge
