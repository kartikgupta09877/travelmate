services:
  # TravelMate Backend Web Service (Docker)
  - type: web
    name: travelmate-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: USE_MOCK_DB
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: "travelmate"
      - key: SEED_ON_STARTUP
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"

  # TravelMate Frontend Static Site
  - type: web
    name: travelmate-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        sync: false
